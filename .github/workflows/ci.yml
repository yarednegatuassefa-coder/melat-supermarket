name: Melat CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: melat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d melat_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/melat_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run domain and PostgreSQL integration tests
        run: npm test
      - name: Build API and client
        run: npm run build

      - name: Keep only runtime dependencies
        run: npm prune --omit=dev
      - name: Assemble prebuilt Windows installation bundle
        run: |
          mkdir -p release/Melat
          cp package.json README.md release/Melat/
          cp -R client server database scripts docs node_modules release/Melat/
          cd release
          zip -qr ../melat-v1.0-windows-bundle.zip Melat
      - name: Upload Windows installation bundle
        uses: actions/upload-artifact@v4
        with:
          name: melat-v1.0-windows-bundle
          path: melat-v1.0-windows-bundle.zip
          if-no-files-found: error
          retention-days: 30
